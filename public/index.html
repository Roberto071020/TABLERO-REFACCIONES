<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicio Cristian · Tablero de Seguimiento de Refacciones</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="toastRoot" class="toast-root"></div>
<div id="modalRoot"></div>
<div id="loginRoot"></div>

<header class="top hidden" id="topHeader">
  <div class="brand">
    <img src="/img/logo.png" alt="Servicio Cristian">
    <div class="brand-text">Servicio Cristian<small>Seguimiento de siniestros, pedidos y refacciones</small></div>
  </div>
  <button class="nav-toggle no-print" id="navToggle" onclick="toggleMenuMovil()" aria-label="Abrir menu">&#9776; Menu</button>
  <nav class="tabs" id="mainTabs"></nav>
  <div class="search-box no-print">
    <input id="globalSearch" placeholder="Buscar siniestro, pedido, placa..." onkeydown="if(event.key==='Enter')doGlobalSearch()">
    <button class="btn small" onclick="doGlobalSearch()">Buscar</button>
  </div>
  <button class="btn secondary small no-print" onclick="openNuevoMenu()">+ Nuevo</button>
  <span class="userchip" id="userChip"></span>
  <button class="btn ghost small no-print" onclick="hacerLogout()">Salir</button>
</header>

<main id="app"></main>

<footer class="note hidden" id="footerNote">Servicio Cristian · Tablero de Seguimiento de Refacciones · Base de datos compartida (no localStorage). Los correos requieren aprobación expresa antes de registrarse; no se envían automáticamente.</footer>

<script src="/app.js"></script>
</body>
</html>
